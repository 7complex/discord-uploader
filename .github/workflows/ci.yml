name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # Dependências do Fyne (OpenGL e X11)
        sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxxf86vm-dev
        # Dependência para validar o script Bash
        sudo apt-get install -y shellcheck

    - name: Lint Bash Script
      run: shellcheck discord-uploader.sh

    - name: Build GUI (Linux)
      run: |
        cd gui
        go mod tidy
        go build ./...

    - name: Build Native (Linux)
      run: |
        cd native
        go mod tidy
        go build ./...
